# checkout-service production configuration (excerpt)
# Source: config repo, environment "production", identical for v2.13.4 and v2.14.0

datasource:
  connection_string: "Host=cart-items-db.prod.internal;Port=5432;Database=cart"
  pool:
    max_pool_size: 50            # set at capacity review 2026-04-02
    min_pool_size: 10
    connection_timeout_ms: 5000  # max wait for a free connection
    connection_lifetime_s: 1800

efcore:
  lazy_loading_proxies_enabled: true
  query_split_behavior: single_query # no query splitting configured

payment_gateway:
  base_url: https://api.payment-gateway.example/v1
  timeout_ms: 3000
  retry:
    max_attempts: 3
    backoff: fixed
    backoff_delay_ms: 200
    jitter: false
    retry_on: [timeout, 5xx, 429]
  circuit_breaker:
    enabled: false
  idempotency_key:
    enabled: false               # charge requests are not idempotent on retry

client_retry:                    # web/app checkout front-end
  max_attempts: 3
  backoff_delay_ms: 500
  retry_on: [504, 502]
